include:
  - compose.librechat.yaml

networks:
  traefik:
    external: true

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    command: --config /app/config.yaml
    container_name: litellm
    environment:
      MISTRAL_API_KEY: pls no leak
      MISTRAL_API_BASE: https://api.eu.mistral.ai/
      LITELLM_MASTER_KEY: pls no leak
      DATABASE_URL: postgres://postgres:postgres@localhost/litellm
    networks:
      - traefik
        #ports:
        #- "4000:4000"
    expose:
      - 4000
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    labels:
      traefik.http.services.litellm.loadbalancer.server.port: 4000
      traefik.http.routers.litellm.rule: Host(`ai.esek.se`)
