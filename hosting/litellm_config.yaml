model_list:
  # Real model names (base models)
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash-1017:floor
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OR_GLOBAL_API_BASE
      extra_body:
        provider:
          zdr: true

  - model_name: gpt-6-luna
    litellm_params:
      model: openrouter/openai/gpt-6-luna
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OR_EU_API_BASE
      extra_body:
        provider:
          order: ["azure/eu"]

  - model_name: claude-haiku-5.5
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OR_EU_API_BASE
      extra_body:
        # OpenRouter automatic caching advances with the conversation (5-minute TTL).
        cache_control:
          type: ephemeral
        provider:
          order: ["google-vertex/europe"]

  - model_name: gpt-6.1-terra
    litellm_params:
      model: openrouter/openai/gpt-6.1-terra
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OR_EU_API_BASE
      extra_body:
        provider:
          order: ["azure/eu"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_env_credential_login: true

router_settings:
  model_group_alias:
    external-cheap: deepseek-v4.1-flash
    eu-cheap: gpt-6-luna
    eu-medium: claude-haiku-5.5
    eu-expensive: gpt-6.1-terra

litellm_settings:
  drop_params: true
  default_key_generate_params:
    max_budget: 5
    budget_duration: "30d"
    models: []
